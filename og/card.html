<!doctype html>
<!-- Link-preview card (1200×630). Rendered to assets/og.jpg with headless Chrome:
     see the command in NOTES.md. Not deployed (listed in .vercelignore). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..600&family=Hanken+Grotesk:wght@400;500;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f3f3f0;
    color: #15201b;
    font-family: "Hanken Grotesk", sans-serif;
    display: grid;
    grid-template-columns: 430px 1fr;
    gap: 64px;
    align-items: center;
    padding: 56px 80px 56px 56px;
    box-sizing: border-box;
  }
  .photo {
    width: 430px;
    height: 518px;
    border-radius: 28px;
    overflow: hidden;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
  .name {
    display: flex; align-items: center; gap: 12px;
    font-size: 28px; font-weight: 500; color: #5d6762;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #6fae4f; }
  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 500;
    font-size: 72px;
    line-height: 1.04;
    letter-spacing: -0.03em;
    margin: 22px 0 0;
  }
  .tags { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tag {
    font-size: 24px; font-weight: 500;
    padding: 10px 18px; border-radius: 999px;
    background: #1c3a2f; color: #eef3ee;
  }
  .tag.lime { background: #d4ee8a; color: #1c3a2f; }
</style>
</head>
<body>
  <div class="photo"><img src="../assets/images/juliana.jpg" alt=""></div>
  <div>
    <div class="name"><span class="dot"></span>Juliana Zappitell</div>
    <h1>Marketing for health and wellness brands.</h1>
    <div class="tags">
      <span class="tag">Content strategy</span>
      <span class="tag">Writing</span>
      <span class="tag lime">SEO/GEO</span>
    </div>
  </div>
</body>
</html>
